# 카드 알림 → 홈 대기 목록 → 채운 입력 시트 → 저장(PRD 4.9). 앞에서 adb로 승인 알림과 읽지 못한 알림을 올렸다.
# 새로 설치한 앱에는 모델이 없어 처음 보는 가맹점은 "카테고리 고르기"다
appId: com.eeennsu.spendback
name: 카드 알림 · 승인
---
- extendedWaitUntil:
    visible: '카드 알림'
    timeout: 30000
- scrollUntilVisible:
    element: '스타벅스 역삼점 기록, 카테고리 고르기 · 오늘, 12,300원'
    direction: DOWN
- tapOn: '스타벅스 역삼점 기록, 카테고리 고르기 · 오늘, 12,300원'

# 시트: 금액·날짜·메모·카드가 채워져 있고 카테고리만 고른다
- assertVisible: '스타벅스 역삼점 기록'
- assertVisible: '12,300'
- assertVisible: '스타벅스 역삼점 · 카드'
- tapOn: '카페·간식'
- tapOn: '저장'
- assertNotVisible: '스타벅스 역삼점 기록'

# 읽지 못한 알림은 원문을 보이고 넘긴다
- scrollUntilVisible:
    element: '읽지 못한 알림.*'
    direction: DOWN
- tapOn: '읽지 못한 알림.*'
- assertVisible: '.*승인 거절 안내.*'
- tapOn: '넘기기'
- assertNotVisible: '읽지 못한 알림.*'

# 최근 지출에 메모(가맹점)와 고른 카테고리로 남았다
- scrollUntilVisible:
    element: '스타벅스 역삼점, 카페·간식 · 오늘, 12,300원'
    direction: DOWN
